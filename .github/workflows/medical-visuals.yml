name: Medical visual assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/medical-visuals.yml'
      - 'website/scripts/medical-diagrams.mjs'
      - 'website/public/medical-2d/**'
      - 'website/src/data/medical-visuals.json'
      - 'website/src/components/MedicalVisual.astro'
      - 'website/src/pages/medical-visuals.astro'
      - 'website/src/content/articles/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - name: Verify committed 2D diagrams and annotations
        run: node scripts/medical-diagrams.mjs --check
        working-directory: website
      - name: Type-check and build
        run: |
          npm run check
          npm run build
        working-directory: website
# 3D generator sources remain archived. This workflow never overwrites the 2D assets or article content.
