<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">內側副韌帶：膝內側支撐・2D 示意圖</title><desc id="desc">內側位置：MCL 位在膝內側，與外側的腓骨分處不同側。 連接兩骨：連接股骨與脛骨，參與抵抗膝部外翻受力。 傷勢評估：拉傷程度與穩定性需實際檢查，不能只依腫痛分級。</desc><rect width="600" height="440" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M250 65 L350 65 L345 158 Q385 183 355 214 Q325 233 300 209 Q275 233 245 214 Q215 183 255 158 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M235 265 Q300 251 365 265 L341 305 L339 388 L261 388 L259 305 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M393 283 Q411 273 419 292 L411 388 L394 388 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M232 179 Q214 225 239 290" fill="none" stroke="#c86c2e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M223 236 L24 238" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="223" cy="236" r="4" fill="#16838a"/><text x="24" y="228" font-size="24" fill="#213b45" text-anchor="start">內側副韌帶</text><text x="26" y="270" font-size="18" fill="#213b45" text-anchor="start">內側</text><text x="435" y="310" font-size="18" fill="#213b45" text-anchor="start">外側</text><path d="M347 118 L430 101" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="347" cy="118" r="4" fill="#16838a"/><text x="430" y="91" font-size="24" fill="#213b45" text-anchor="start">股骨</text><path d="M263 345 L75 386" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="263" cy="345" r="4" fill="#16838a"/><text x="75" y="376" font-size="24" fill="#213b45" text-anchor="start">脛骨</text></g></svg>
