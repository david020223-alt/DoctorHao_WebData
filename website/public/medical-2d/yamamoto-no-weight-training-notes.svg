<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">運動表現：訓練需要個別化・2D 示意圖</title><desc id="desc">基礎能力：力量、控制與恢復是安排訓練時的考量。 專項需求：速度、協調與技巧需配合不同運動項目。 個別調整：考慮賽季、疲勞與傷勢，不直接照抄名人課表。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><circle cx="301" cy="82" r="25" fill="#16838a"/><path d="M301 124 L300 233 L374 279 L419 368 M300 233 L222 302 L196 369 M301 137 L402 177 L412 212" fill="none" stroke="#16838a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="233" r="9" fill="#c86c2e"/><circle cx="374" cy="279" r="9" fill="#c86c2e"/><path d="M145 391 L462 391" fill="none" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="30" font-size="20" fill="#769b9f" text-anchor="middle">動作概念示意</text><path d="M300 233 L40 231" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="233" r="4" fill="#16838a"/><text x="40" y="221" font-size="24" fill="#213b45" text-anchor="start">髖部</text><path d="M374 279 L461 294" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="374" cy="279" r="4" fill="#16838a"/><text x="461" y="284" font-size="24" fill="#213b45" text-anchor="start">膝部</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">運動表現：訓練需要個別化</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 基礎能力</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">力量、控制與恢復是安排訓練時的考量。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 專項需求</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">速度、協調與技巧需配合不同運動項目。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 個別調整</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">考慮賽季、疲勞與傷勢，不直接照抄名人課表。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
