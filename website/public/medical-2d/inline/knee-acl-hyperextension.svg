<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">前十字韌帶與膝穩定・2D 示意圖</title><desc id="desc">股骨與脛骨：韌帶位在兩骨之間，圖中部分結構移開以利觀看。 前十字韌帶：協助限制脛骨過度向前位移，並參與旋轉穩定。 功能恢復：回場需綜合肌力、動作控制及醫療評估，不只看影像。</desc><rect width="600" height="440" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M250 65 L350 65 L345 158 Q385 183 355 214 Q325 233 300 209 Q275 233 245 214 Q215 183 255 158 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M235 265 Q300 251 365 265 L341 305 L339 388 L261 388 L259 305 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M393 283 Q411 273 419 292 L411 388 L394 388 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M334 200 L270 267" fill="none" stroke="#c86c2e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M307 228 L398 235" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="307" cy="228" r="4" fill="#16838a"/><text x="398" y="225" font-size="24" fill="#213b45" text-anchor="start">前十字韌帶</text><path d="M347 118 L430 101" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="347" cy="118" r="4" fill="#16838a"/><text x="430" y="91" font-size="24" fill="#213b45" text-anchor="start">股骨</text><path d="M263 345 L75 386" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="263" cy="345" r="4" fill="#16838a"/><text x="75" y="376" font-size="24" fill="#213b45" text-anchor="start">脛骨</text></g></svg>
