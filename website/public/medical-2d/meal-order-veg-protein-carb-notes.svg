<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">用餐順序：只是其中一環・2D 示意圖</title><desc id="desc">蔬菜：可以從蔬菜開始安排均衡的一餐。 蛋白質：與其他食物共同搭配，而不是排除主食。 主食與份量：整餐份量、食物種類及用藥同樣重要。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="300" y="49" font-size="20" fill="#769b9f" text-anchor="middle">閱讀重點</text><rect x="42" y="75" width="516" height="94" rx="18" fill="#f3f6f5" stroke="#d0dfdc"/><circle cx="86" cy="122" r="23" fill="#16838a"/><text x="86" y="130" font-size="24" fill="white" text-anchor="middle">1</text><text x="129" y="131" font-size="26" fill="#213b45" text-anchor="start">蔬菜</text><rect x="42" y="190" width="516" height="94" rx="18" fill="#e8f4ef" stroke="#d0dfdc"/><circle cx="86" cy="237" r="23" fill="#c86c2e"/><text x="86" y="245" font-size="24" fill="white" text-anchor="middle">2</text><text x="129" y="246" font-size="26" fill="#213b45" text-anchor="start">蛋白質</text><rect x="42" y="305" width="516" height="94" rx="18" fill="#f3f6f5" stroke="#d0dfdc"/><circle cx="86" cy="352" r="23" fill="#16838a"/><text x="86" y="360" font-size="24" fill="white" text-anchor="middle">3</text><text x="129" y="361" font-size="26" fill="#213b45" text-anchor="start">主食與份量</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">用餐順序：只是其中一環</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 蔬菜</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">可以從蔬菜開始安排均衡的一餐。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 蛋白質</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">與其他食物共同搭配，而不是排除主食。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 主食與份量</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">整餐份量、食物種類及用藥同樣重要。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
