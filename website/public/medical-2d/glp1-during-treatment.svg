<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">體重治療：用藥以外的事・2D 示意圖</title><desc id="desc">飲食支持：維持足夠營養與水分，不以極端少吃為目標。 活動與肌力：依能力安排有氧與阻力訓練，照顧日常功能。 定期追蹤：副作用、療效與後續計畫由醫療團隊共同評估。</desc><rect width="600" height="440" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="300" y="49" font-size="20" fill="#769b9f" text-anchor="middle">閱讀重點</text><rect x="42" y="75" width="516" height="94" rx="18" fill="#f3f6f5" stroke="#d0dfdc"/><circle cx="86" cy="122" r="23" fill="#16838a"/><text x="86" y="130" font-size="24" fill="white" text-anchor="middle">1</text><text x="129" y="131" font-size="26" fill="#213b45" text-anchor="start">飲食支持</text><rect x="42" y="190" width="516" height="94" rx="18" fill="#e8f4ef" stroke="#d0dfdc"/><circle cx="86" cy="237" r="23" fill="#c86c2e"/><text x="86" y="245" font-size="24" fill="white" text-anchor="middle">2</text><text x="129" y="246" font-size="26" fill="#213b45" text-anchor="start">活動與肌力</text><rect x="42" y="305" width="516" height="94" rx="18" fill="#f3f6f5" stroke="#d0dfdc"/><circle cx="86" cy="352" r="23" fill="#16838a"/><text x="86" y="360" font-size="24" fill="white" text-anchor="middle">3</text><text x="129" y="361" font-size="26" fill="#213b45" text-anchor="start">定期追蹤</text></g></svg>
