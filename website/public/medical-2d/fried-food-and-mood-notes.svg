<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">飲食與情緒：別畫上等號・2D 示意圖</title><desc id="desc">飲食習慣：評估的是整體飲食模式，而不只一份食物。 情緒與睡眠：心理健康也受到睡眠、壓力與生活環境影響。 研究解讀：觀察到關聯不等於證明因果，不能用飲食圖診斷憂鬱症。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="300" y="49" font-size="20" fill="#769b9f" text-anchor="middle">閱讀重點</text><rect x="42" y="75" width="516" height="94" rx="18" fill="#f3f6f5" stroke="#d0dfdc"/><circle cx="86" cy="122" r="23" fill="#16838a"/><text x="86" y="130" font-size="24" fill="white" text-anchor="middle">1</text><text x="129" y="131" font-size="26" fill="#213b45" text-anchor="start">飲食習慣</text><rect x="42" y="190" width="516" height="94" rx="18" fill="#e8f4ef" stroke="#d0dfdc"/><circle cx="86" cy="237" r="23" fill="#c86c2e"/><text x="86" y="245" font-size="24" fill="white" text-anchor="middle">2</text><text x="129" y="246" font-size="26" fill="#213b45" text-anchor="start">情緒與睡眠</text><rect x="42" y="305" width="516" height="94" rx="18" fill="#f3f6f5" stroke="#d0dfdc"/><circle cx="86" cy="352" r="23" fill="#16838a"/><text x="86" y="360" font-size="24" fill="white" text-anchor="middle">3</text><text x="129" y="361" font-size="26" fill="#213b45" text-anchor="start">研究解讀</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">飲食與情緒：別畫上等號</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 飲食習慣</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">評估的是整體飲食模式，而不只一份食物。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 情緒與睡眠</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">心理健康也受到睡眠、壓力與生活環境影響。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 研究解讀</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">觀察到關聯不等於證明因果，不能用飲食圖診斷憂鬱症。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
