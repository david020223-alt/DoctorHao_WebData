<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">硬舉：先認識髖折疊・2D 示意圖</title><desc id="desc">髖部後移：軀幹與髖部協調，練習可控制的活動範圍。 軀幹穩定：呼吸、軀幹控制與負荷需配合個人能力。 循序增加：先學動作，再調整重量；不是所有人都需相同姿勢或重量。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><circle cx="359" cy="117" r="25" fill="#16838a"/><path d="M337 155 L259 226 L311 298 L276 368 M259 226 L222 302 L196 369 M337 168 L400 221 L410 256" fill="none" stroke="#16838a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><circle cx="259" cy="226" r="9" fill="#c86c2e"/><circle cx="311" cy="298" r="9" fill="#c86c2e"/><path d="M145 391 L462 391" fill="none" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="30" font-size="20" fill="#769b9f" text-anchor="middle">動作概念示意</text><path d="M259 226 L40 231" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="259" cy="226" r="4" fill="#16838a"/><text x="40" y="221" font-size="24" fill="#213b45" text-anchor="start">髖部</text><path d="M311 298 L461 294" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="311" cy="298" r="4" fill="#16838a"/><text x="461" y="284" font-size="24" fill="#213b45" text-anchor="start">膝部</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">硬舉：先認識髖折疊</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 髖部後移</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">軀幹與髖部協調，練習可控制的活動範圍。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 軀幹穩定</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">呼吸、軀幹控制與負荷需配合個人能力。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 循序增加</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">先學動作，再調整重量；不是所有人都需相同姿勢或重量。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
