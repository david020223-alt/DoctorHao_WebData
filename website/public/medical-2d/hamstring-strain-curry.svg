<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">腿後肌：從受傷到回場・2D 示意圖</title><desc id="desc">腿後肌群：位在大腿後側，與髖伸展、膝屈曲有關。 受力區域：衝刺或拉長狀態下受力，可能造成肌肉肌腱損傷。 功能性進程：恢復活動、肌力及專項能力，再由團隊評估回場。</desc><rect width="600" height="440" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M226 95 Q209 163 231 216 L224 377 L276 377 L300 238 L324 377 L376 377 L369 216 Q391 163 374 95 Z" fill="#f6f4eb" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M246 227 L244 345 M270 235 L263 345 M333 235 L340 345 M357 227 L358 345" fill="none" stroke="#16838a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M252 290 L25 284" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="252" cy="290" r="4" fill="#16838a"/><text x="25" y="274" font-size="24" fill="#213b45" text-anchor="start">腿後肌群</text><text x="300" y="50" font-size="20" fill="#769b9f" text-anchor="middle">後側示意</text></g></svg>
