<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">匹克球：上肢也要準備・2D 示意圖</title><desc id="desc">肘部骨點：肌腱附著於骨骼周邊，是受力傳遞的一環。 前臂伸肌：反覆握拍與揮拍可能增加相關組織負荷。 全身準備：除了上肢，步伐、平衡與跌倒風險也要一起注意。</desc><rect width="600" height="440" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M239 76 L286 76 L288 239 Q273 272 239 247 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M258 271 Q282 265 294 281 L401 359 L375 384 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M298 252 L423 331 L408 348 L289 273 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M293 242 Q325 266 365 293" fill="none" stroke="#16838a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 130 L350 120" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="130" r="4" fill="#16838a"/><text x="350" y="110" font-size="24" fill="#213b45" text-anchor="start">肱骨</text><path d="M307 251 L30 255" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="307" cy="251" r="4" fill="#16838a"/><text x="30" y="245" font-size="24" fill="#213b45" text-anchor="start">伸肌腱區</text><path d="M371 331 L439 304" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="371" cy="331" r="4" fill="#16838a"/><text x="439" y="294" font-size="24" fill="#213b45" text-anchor="start">前臂</text></g></svg>
