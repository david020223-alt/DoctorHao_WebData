<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">手麻：以尺神經為例・2D 示意圖</title><desc id="desc">肘內側：尺神經經過肘部內側附近的通道。 神經走向：壓迫可能影響前臂與手部感覺；分布需實際檢查。 治療評估：先釐清原因，再決定活動調整、復健或其他處理。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M239 76 L286 76 L288 239 Q273 272 239 247 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M258 271 Q282 265 294 281 L401 359 L375 384 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M298 252 L423 331 L408 348 L289 273 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 100 Q207 236 238 278 L343 366" fill="none" stroke="#c86c2e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 130 L350 120" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="130" r="4" fill="#16838a"/><text x="350" y="110" font-size="24" fill="#213b45" text-anchor="start">肱骨</text><path d="M219 251 L30 255" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="219" cy="251" r="4" fill="#16838a"/><text x="30" y="245" font-size="24" fill="#213b45" text-anchor="start">尺神經</text><path d="M371 331 L439 304" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="371" cy="331" r="4" fill="#16838a"/><text x="439" y="294" font-size="24" fill="#213b45" text-anchor="start">前臂</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">手麻：以尺神經為例</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 肘內側</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">尺神經經過肘部內側附近的通道。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 神經走向</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">壓迫可能影響前臂與手部感覺；分布需實際檢查。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 治療評估</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">先釐清原因，再決定活動調整、復健或其他處理。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
