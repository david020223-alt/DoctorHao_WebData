<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">羽球：肩部負荷與控制・2D 示意圖</title><desc id="desc">肩胛骨：肩帶的活動與控制是揮拍動作的一環。 旋轉肌袖：包覆肱骨頭的肌腱群，協助肩部動作與穩定。 負荷安排：反覆過頭揮拍的強度、恢復與症狀要一起評估。</desc><rect width="600" height="440" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M170 150 Q240 100 302 144 L281 275 L238 321 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M323 174 Q346 159 370 180 Q396 204 366 236 L381 365 L338 372 L321 235 Q299 206 323 174 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M181 119 Q250 95 324 122 L357 148" fill="none" stroke="#769b9f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M217 148 Q285 143 324 169 Q347 180 355 198" fill="none" stroke="#16838a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M222 214 L30 245" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="222" cy="214" r="4" fill="#16838a"/><text x="30" y="235" font-size="24" fill="#213b45" text-anchor="start">肩胛骨</text><path d="M362 319 L444 367" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="362" cy="319" r="4" fill="#16838a"/><text x="444" y="357" font-size="24" fill="#213b45" text-anchor="start">肱骨</text><path d="M336 168 L389 109" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="336" cy="168" r="4" fill="#16838a"/><text x="389" y="99" font-size="24" fill="#213b45" text-anchor="start">旋轉肌袖</text><text x="300" y="40" font-size="20" fill="#769b9f" text-anchor="middle">肩部結構・簡化示意</text></g></svg>
