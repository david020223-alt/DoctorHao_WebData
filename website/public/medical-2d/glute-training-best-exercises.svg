<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">臀肌：不只是外觀・2D 示意圖</title><desc id="desc">臀大肌：參與髖部伸展，和日常起身、登階等動作相關。 臀中肌區：位在髖外側，參與髖部控制與骨盆穩定。 訓練安排：動作選擇需配合目標、能力與症狀，不只看單次研究排名。</desc><rect width="600" height="440" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M226 95 Q209 163 231 216 L224 377 L276 377 L300 238 L324 377 L376 377 L369 216 Q391 163 374 95 Z" fill="#f6f4eb" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 144 Q268 126 298 159 L290 217 Q249 239 231 201 Z M370 144 Q332 126 302 159 L310 217 Q351 239 369 201 Z" fill="#dcefeb" stroke="#16838a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 113 Q257 95 286 126 M375 113 Q343 95 314 126" fill="none" stroke="#c86c2e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M249 113 L34 99" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="249" cy="113" r="4" fill="#16838a"/><text x="34" y="89" font-size="24" fill="#213b45" text-anchor="start">臀中肌區</text><path d="M345 186 L421 242" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="345" cy="186" r="4" fill="#16838a"/><text x="421" y="232" font-size="24" fill="#213b45" text-anchor="start">臀大肌</text><text x="300" y="50" font-size="20" fill="#769b9f" text-anchor="middle">後側示意</text></g></svg>
