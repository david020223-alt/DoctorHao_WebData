<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">籃球：認識踝外側結構・2D 示意圖</title><desc id="desc">脛骨與腓骨：構成踝部上方的骨性結構。 外側韌帶：足部內翻時，踝外側組織可能受到牽拉。 恢復控制：逐步重建活動、肌力與平衡，再評估跑跳需求。</desc><rect width="600" height="440" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M244 70 L300 70 L294 229 Q275 257 249 235 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M336 70 L359 70 L357 249 L332 253 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M268 253 Q311 238 338 267 L411 315 L245 335 Q207 319 230 285 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M348 249 L299 280 M348 249 L331 316" fill="none" stroke="#c86c2e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M251 131 L100 110" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="251" cy="131" r="4" fill="#16838a"/><text x="100" y="100" font-size="24" fill="#213b45" text-anchor="start">脛骨</text><path d="M350 141 L422 124" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="350" cy="141" r="4" fill="#16838a"/><text x="422" y="114" font-size="24" fill="#213b45" text-anchor="start">腓骨</text><path d="M336 277 L415 259" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="336" cy="277" r="4" fill="#16838a"/><text x="415" y="249" font-size="24" fill="#213b45" text-anchor="start">外側韌帶</text><text x="300" y="390" font-size="20" fill="#769b9f" text-anchor="middle">踝外側結構示意</text></g></svg>
