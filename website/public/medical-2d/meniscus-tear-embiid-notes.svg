<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">半月板：膝內的纖維軟骨・2D 示意圖</title><desc id="desc">兩片半月板：內、外側各一片，位在股骨與脛骨之間。 負荷分散：協助關節承重與穩定，不等於覆蓋骨端的關節軟骨。 撕裂評估：位置、型態、症狀與個人需求影響治療選擇。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M250 65 L350 65 L345 158 Q385 183 355 214 Q325 233 300 209 Q275 233 245 214 Q215 183 255 158 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M235 265 Q300 251 365 265 L341 305 L339 388 L261 388 L259 305 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M393 283 Q411 273 419 292 L411 388 L394 388 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M236 241 Q265 226 292 241 Q266 252 236 247 Z" fill="#16838a" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M308 241 Q337 226 364 241 L364 247 Q338 252 308 241 Z" fill="#16838a" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M342 240 L445 259" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="342" cy="240" r="4" fill="#16838a"/><text x="445" y="249" font-size="24" fill="#213b45" text-anchor="start">半月板</text><path d="M347 118 L430 101" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="347" cy="118" r="4" fill="#16838a"/><text x="430" y="91" font-size="24" fill="#213b45" text-anchor="start">股骨</text><path d="M263 345 L75 386" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="263" cy="345" r="4" fill="#16838a"/><text x="75" y="376" font-size="24" fill="#213b45" text-anchor="start">脛骨</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">半月板：膝內的纖維軟骨</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 兩片半月板</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">內、外側各一片，位在股骨與脛骨之間。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 負荷分散</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">協助關節承重與穩定，不等於覆蓋骨端的關節軟骨。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 撕裂評估</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">位置、型態、症狀與個人需求影響治療選擇。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
