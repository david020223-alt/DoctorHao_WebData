<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">肌骨超音波：從定位開始・2D 示意圖</title><desc id="desc">探頭：聲波由探頭進出，檢查方向需對照解剖。 組織層次：皮膚下有不同軟組織，不能只憑亮暗判讀病灶。 動態評估：影像需結合病史、理學檢查及專業操作。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><rect x="80" y="226" width="440" height="128" rx="14" fill="#dcefeb"/><path d="M80 227 L520 227 M80 269 L520 269 M80 312 L520 312" fill="none" stroke="#769b9f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="230" y="90" width="140" height="100" rx="16" fill="#16838a"/><path d="M244 198 L197 337 L403 337 L356 198 Z" fill="none" stroke="#16838a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M351 145 L420 145" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="351" cy="145" r="4" fill="#16838a"/><text x="420" y="135" font-size="24" fill="#213b45" text-anchor="start">探頭</text><path d="M152 270 L67 411" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="152" cy="270" r="4" fill="#16838a"/><text x="67" y="401" font-size="24" fill="#213b45" text-anchor="start">組織層次</text><text x="300" y="50" font-size="20" fill="#769b9f" text-anchor="middle">超音波檢查・概念示意</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">肌骨超音波：從定位開始</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 探頭</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">聲波由探頭進出，檢查方向需對照解剖。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 組織層次</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">皮膚下有不同軟組織，不能只憑亮暗判讀病灶。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 動態評估</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">影像需結合病史、理學檢查及專業操作。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
