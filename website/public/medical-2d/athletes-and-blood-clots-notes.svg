<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">血栓：運動員也要留意・2D 示意圖</title><desc id="desc">靜脈管腔：圖中藍色為靜脈示意，不是動脈斑塊。 血塊：深層靜脈血栓可影響回流；部分血塊可能移至肺部。 警覺症狀：單側肢體腫痛需評估；突發胸痛或呼吸困難需緊急就醫。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M242 75 L242 373 M352 75 L352 373" fill="none" stroke="#377da5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="248" y="75" width="98" height="298" fill="#e0eff7"/><path d="M249 190 Q270 186 287 221 M345 190 Q324 186 307 221" fill="none" stroke="#377da5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M297 158 L297 99 M283 115 L297 99 L311 115" fill="none" stroke="#16838a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M248 282 Q294 252 296 303 Q290 329 248 327 Z" fill="#c86c2e" stroke="#c86c2e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M245 149 L61 137" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="245" cy="149" r="4" fill="#16838a"/><text x="61" y="127" font-size="24" fill="#213b45" text-anchor="start">靜脈</text><path d="M297 119 L399 97" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="297" cy="119" r="4" fill="#16838a"/><text x="399" y="87" font-size="24" fill="#213b45" text-anchor="start">朝心臟回流</text><path d="M278 301 L399 289" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="278" cy="301" r="4" fill="#16838a"/><text x="399" y="279" font-size="24" fill="#213b45" text-anchor="start">血塊</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">血栓：運動員也要留意</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 靜脈管腔</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">圖中藍色為靜脈示意，不是動脈斑塊。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 血塊</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">深層靜脈血栓可影響回流；部分血塊可能移至肺部。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 警覺症狀</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">單側肢體腫痛需評估；突發胸痛或呼吸困難需緊急就醫。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
