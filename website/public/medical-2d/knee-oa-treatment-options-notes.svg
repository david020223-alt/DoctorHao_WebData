<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">膝關節炎：結構與功能・2D 示意圖</title><desc id="desc">關節表面：退化可能伴隨軟骨變薄與骨端改變，表現因人而異。 周邊肌力：膝部功能也受到肌力、活動與負荷影響。 共同決策：治療要整合症狀、功能需求與個別風險。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M250 65 L350 65 L345 158 Q385 183 355 214 Q325 233 300 209 Q275 233 245 214 Q215 183 255 158 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M235 265 Q300 251 365 265 L341 305 L339 388 L261 388 L259 305 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M393 283 Q411 273 419 292 L411 388 L394 388 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M242 216 Q271 235 294 215 M306 215 Q331 235 358 216" fill="none" stroke="#16838a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M254 218 L24 178" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="254" cy="218" r="4" fill="#16838a"/><text x="24" y="168" font-size="24" fill="#213b45" text-anchor="start">關節軟骨變化</text><path d="M347 118 L430 101" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="347" cy="118" r="4" fill="#16838a"/><text x="430" y="91" font-size="24" fill="#213b45" text-anchor="start">股骨</text><path d="M263 345 L75 386" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="263" cy="345" r="4" fill="#16838a"/><text x="75" y="376" font-size="24" fill="#213b45" text-anchor="start">脛骨</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">膝關節炎：結構與功能</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 關節表面</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">退化可能伴隨軟骨變薄與骨端改變，表現因人而異。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 周邊肌力</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">膝部功能也受到肌力、活動與負荷影響。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 共同決策</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">治療要整合症狀、功能需求與個別風險。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
