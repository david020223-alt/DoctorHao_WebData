<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">旋轉肌袖：肩部的協同・2D 示意圖</title><desc id="desc">肩胛骨與肱骨：骨性結構是肩部動作的基礎。 旋轉肌袖：四條肌肉及其肌腱共同參與抬手與旋轉。 肩峰下空間：反覆負荷與軟組織問題需結合症狀評估。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M170 150 Q240 100 302 144 L281 275 L238 321 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M323 174 Q346 159 370 180 Q396 204 366 236 L381 365 L338 372 L321 235 Q299 206 323 174 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M181 119 Q250 95 324 122 L357 148" fill="none" stroke="#769b9f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M217 148 Q285 143 324 169 Q347 180 355 198" fill="none" stroke="#16838a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M222 214 L30 245" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="222" cy="214" r="4" fill="#16838a"/><text x="30" y="235" font-size="24" fill="#213b45" text-anchor="start">肩胛骨</text><path d="M362 319 L444 367" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="362" cy="319" r="4" fill="#16838a"/><text x="444" y="357" font-size="24" fill="#213b45" text-anchor="start">肱骨</text><path d="M336 168 L389 109" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="336" cy="168" r="4" fill="#16838a"/><text x="389" y="99" font-size="24" fill="#213b45" text-anchor="start">旋轉肌袖</text><text x="300" y="40" font-size="20" fill="#769b9f" text-anchor="middle">肩部結構・簡化示意</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">旋轉肌袖：肩部的協同</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 肩胛骨與肱骨</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">骨性結構是肩部動作的基礎。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 旋轉肌袖</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">四條肌肉及其肌腱共同參與抬手與旋轉。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 肩峰下空間</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">反覆負荷與軟組織問題需結合症狀評估。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
