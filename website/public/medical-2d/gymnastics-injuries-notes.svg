<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">體操：上肢承重的提醒・2D 示意圖</title><desc id="desc">前臂骨：橈骨與尺骨把負荷傳往肘與肩。 腕部結構：小骨、韌帶與肌腱共同參與支撐。 成長中的運動員：持續疼痛或功能改變，應接受適齡評估。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M246 74 L275 74 L283 213 L240 213 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M309 74 L328 74 L334 210 L307 210 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="231" y="230" width="29" height="24" rx="7" fill="#f2e9d5" stroke="#769b9f" stroke-width="2"/><rect x="268" y="230" width="29" height="24" rx="7" fill="#f2e9d5" stroke="#769b9f" stroke-width="2"/><rect x="305" y="230" width="29" height="24" rx="7" fill="#f2e9d5" stroke="#769b9f" stroke-width="2"/><rect x="231" y="260" width="29" height="24" rx="7" fill="#f2e9d5" stroke="#769b9f" stroke-width="2"/><rect x="268" y="260" width="29" height="24" rx="7" fill="#f2e9d5" stroke="#769b9f" stroke-width="2"/><rect x="305" y="260" width="29" height="24" rx="7" fill="#f2e9d5" stroke="#769b9f" stroke-width="2"/><path d="M236 296 L227 371" fill="none" stroke="#769b9f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M267 296 L262 371" fill="none" stroke="#769b9f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M298 296 L297 371" fill="none" stroke="#769b9f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M329 296 L332 371" fill="none" stroke="#769b9f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M253 142 L98 119" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="253" cy="142" r="4" fill="#16838a"/><text x="98" y="109" font-size="24" fill="#213b45" text-anchor="start">橈骨</text><path d="M322 142 L414 120" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="322" cy="142" r="4" fill="#16838a"/><text x="414" y="110" font-size="24" fill="#213b45" text-anchor="start">尺骨</text><path d="M312 263 L419 273" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="312" cy="263" r="4" fill="#16838a"/><text x="419" y="263" font-size="24" fill="#213b45" text-anchor="start">腕骨</text><text x="300" y="415" font-size="20" fill="#769b9f" text-anchor="middle">腕部結構示意</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">體操：上肢承重的提醒</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 前臂骨</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">橈骨與尺骨把負荷傳往肘與肩。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 腕部結構</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">小骨、韌帶與肌腱共同參與支撐。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 成長中的運動員</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">持續疼痛或功能改變，應接受適齡評估。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
