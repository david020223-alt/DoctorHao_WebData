<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">跑者肌力：把控制補起來・2D 示意圖</title><desc id="desc">髖部控制：讓髖與軀幹一起參與動作。 膝踝協作：練習肌力、平衡與可控制的落地。 負荷搭配：跑量、肌力訓練與恢復需整體安排。</desc><rect width="600" height="440" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><circle cx="332" cy="84" r="25" fill="#16838a"/><path d="M321 123 L285 221 L374 270 L416 341 M285 221 L222 302 L196 369 M321 136 L393 183 L403 218" fill="none" stroke="#16838a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><circle cx="285" cy="221" r="9" fill="#c86c2e"/><circle cx="374" cy="270" r="9" fill="#c86c2e"/><path d="M145 391 L462 391" fill="none" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="30" font-size="20" fill="#769b9f" text-anchor="middle">動作概念示意</text><path d="M285 221 L40 231" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="285" cy="221" r="4" fill="#16838a"/><text x="40" y="221" font-size="24" fill="#213b45" text-anchor="start">髖部</text><path d="M374 270 L461 294" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="374" cy="270" r="4" fill="#16838a"/><text x="461" y="284" font-size="24" fill="#213b45" text-anchor="start">膝部</text></g></svg>
