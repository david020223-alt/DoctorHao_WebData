<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">深蹲：控制優先於重量・2D 示意圖</title><desc id="desc">髖膝踝協調：依個人能力選擇能控制的深度與站姿。 軀幹與呼吸：建立可維持的穩定與呼吸節奏。 逐步增加：先練習再調整負荷，有不適時重新評估。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><circle cx="327" cy="91" r="25" fill="#16838a"/><path d="M313 134 L254 232 L345 279 L297 368 M254 232 L222 302 L196 369 M313 147 L389 173 L399 208" fill="none" stroke="#16838a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><circle cx="254" cy="232" r="9" fill="#c86c2e"/><circle cx="345" cy="279" r="9" fill="#c86c2e"/><path d="M145 391 L462 391" fill="none" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="30" font-size="20" fill="#769b9f" text-anchor="middle">動作概念示意</text><path d="M254 232 L40 231" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="254" cy="232" r="4" fill="#16838a"/><text x="40" y="221" font-size="24" fill="#213b45" text-anchor="start">髖部</text><path d="M345 279 L461 294" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="345" cy="279" r="4" fill="#16838a"/><text x="461" y="284" font-size="24" fill="#213b45" text-anchor="start">膝部</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">深蹲：控制優先於重量</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 髖膝踝協調</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">依個人能力選擇能控制的深度與站姿。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 軀幹與呼吸</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">建立可維持的穩定與呼吸節奏。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 逐步增加</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">先練習再調整負荷，有不適時重新評估。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
