<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">肌筋膜疼痛：先評估再處理・2D 示意圖</title><desc id="desc">肌肉纖維：圖中肌束為放大示意，不是影像檢查結果。 關注區域：局部壓痛只是線索，需要結合病史與檢查。 治療選擇：不同處理有各自適應情況、限制與風險。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M118 208 Q161 99 289 129 Q421 150 470 233 Q408 350 286 322 Q161 304 118 208 Z" fill="#dcefeb" stroke="#16838a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 185 Q280 108 445 210" fill="none" stroke="#16838a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 197 Q280 142 445 219" fill="none" stroke="#16838a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 209 Q280 176 445 228" fill="none" stroke="#16838a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 221 Q280 210 445 237" fill="none" stroke="#16838a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 233 Q280 244 445 246" fill="none" stroke="#16838a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="309" cy="219" r="20" fill="#c86c2e"/><path d="M216 161 L30 93" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="216" cy="161" r="4" fill="#16838a"/><text x="30" y="83" font-size="24" fill="#213b45" text-anchor="start">肌肉纖維</text><path d="M309 219 L424 393" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="309" cy="219" r="4" fill="#16838a"/><text x="424" y="383" font-size="24" fill="#213b45" text-anchor="start">關注區域</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">肌筋膜疼痛：先評估再處理</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 肌肉纖維</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">圖中肌束為放大示意，不是影像檢查結果。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 關注區域</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">局部壓痛只是線索，需要結合病史與檢查。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 治療選擇</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">不同處理有各自適應情況、限制與風險。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
