<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">登山：上坡與下坡的控制・2D 示意圖</title><desc id="desc">踏階：髖、膝與踝協同完成向上移動。 下坡：重心下降也需要肌肉控制，不只是往下走。 行程安排：路線、負重、體力與休息要一起規劃。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><circle cx="322" cy="90" r="25" fill="#16838a"/><path d="M307 129 L282 226 L365 260 L365 331 M282 226 L222 302 L196 369 M307 142 L377 191 L387 226" fill="none" stroke="#16838a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><circle cx="282" cy="226" r="9" fill="#c86c2e"/><circle cx="365" cy="260" r="9" fill="#c86c2e"/><path d="M145 391 L462 391" fill="none" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M323 388 L323 347 L438 347" fill="none" stroke="#769b9f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="30" font-size="20" fill="#769b9f" text-anchor="middle">動作概念示意</text><path d="M282 226 L40 231" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="282" cy="226" r="4" fill="#16838a"/><text x="40" y="221" font-size="24" fill="#213b45" text-anchor="start">髖部</text><path d="M365 260 L461 294" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="365" cy="260" r="4" fill="#16838a"/><text x="461" y="284" font-size="24" fill="#213b45" text-anchor="start">膝部</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">登山：上坡與下坡的控制</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 踏階</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">髖、膝與踝協同完成向上移動。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 下坡</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">重心下降也需要肌肉控制，不只是往下走。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 行程安排</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">路線、負重、體力與休息要一起規劃。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
