<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">阿基里斯腱：力量的連結・2D 示意圖</title><desc id="desc">小腿肌群：腓腸肌與比目魚肌的力量經肌腱傳遞。 阿基里斯腱：連接小腿後側肌群與跟骨；圖中橘色為關注區。 回到運動：依傷勢、治療與功能評估循序恢復，不以天數單獨決定。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M270 70 L345 70 Q365 125 339 196 L316 266 L324 325 L431 342 Q450 360 422 369 L262 369 Q242 353 252 319 L262 249 Q228 169 270 70 Z" fill="#f6f4eb" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M278 85 Q241 165 281 237 Q302 254 324 207 Q346 138 328 85 Z" fill="#dcefeb" stroke="#16838a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M292 238 Q285 280 278 338" fill="none" stroke="#c86c2e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M266 337 L309 337 L320 357 L264 357 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M271 154 L40 155" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="271" cy="154" r="4" fill="#16838a"/><text x="40" y="145" font-size="24" fill="#213b45" text-anchor="start">小腿肌群</text><path d="M288 264 L382 264" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="288" cy="264" r="4" fill="#16838a"/><text x="382" y="254" font-size="24" fill="#213b45" text-anchor="start">阿基里斯腱</text><path d="M282 349 L113 385" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="282" cy="349" r="4" fill="#16838a"/><text x="113" y="375" font-size="24" fill="#213b45" text-anchor="start">跟骨</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">阿基里斯腱：力量的連結</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 小腿肌群</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">腓腸肌與比目魚肌的力量經肌腱傳遞。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 阿基里斯腱</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">連接小腿後側肌群與跟骨；圖中橘色為關注區。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 回到運動</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">依傷勢、治療與功能評估循序恢復，不以天數單獨決定。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
