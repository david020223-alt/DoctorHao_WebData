<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">鵝掌區：在膝內側下方・2D 示意圖</title><desc id="desc">三條肌腱：縫匠肌、股薄肌與半腱肌的肌腱匯向脛骨內側。 鵝掌滑囊：在肌腱與深層組織間，協助減少摩擦。 相似症狀：此區疼痛也需與內側韌帶、半月板等問題區分。</desc><rect width="600" height="440" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M250 65 L350 65 L345 158 Q385 183 355 214 Q325 233 300 209 Q275 233 245 214 Q215 183 255 158 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M235 265 Q300 251 365 265 L341 305 L339 388 L261 388 L259 305 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M393 283 Q411 273 419 292 L411 388 L394 388 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M211 151 Q185 272 257 301 M185 164 Q174 289 257 301 M160 179 Q165 305 257 301" fill="none" stroke="#16838a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="256" cy="310" r="15" fill="#f2cfac"/><path d="M201 270 L24 245" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="201" cy="270" r="4" fill="#16838a"/><text x="24" y="235" font-size="24" fill="#213b45" text-anchor="start">鵝掌肌腱</text><path d="M256 310 L414 342" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="256" cy="310" r="4" fill="#16838a"/><text x="414" y="332" font-size="24" fill="#213b45" text-anchor="start">滑囊區域</text><path d="M347 118 L430 101" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="347" cy="118" r="4" fill="#16838a"/><text x="430" y="91" font-size="24" fill="#213b45" text-anchor="start">股骨</text><path d="M263 345 L75 386" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="263" cy="345" r="4" fill="#16838a"/><text x="75" y="376" font-size="24" fill="#213b45" text-anchor="start">脛骨</text></g></svg>
