<svg xmlns="http://www.w3.org/2000/svg" width="600" height="803" viewBox="0 0 600 803" role="img" aria-labelledby="title desc"><title id="title">足底筋膜：腳跟到前足・2D 示意圖</title><desc id="desc">跟骨：足底筋膜由腳跟附近向前延伸。 筋膜扇形束：沿足底延展，參與支撐足弓。 疼痛線索：晨起第一步痛是常見表現，但仍需排除其他原因。</desc><rect width="600" height="803" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M150 103 Q139 201 115 273 Q104 315 145 333 L455 333 Q484 329 480 309 Q476 294 433 282 Q357 265 282 206 Q240 172 242 103 Z" fill="#f6f4eb" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 279 Q157 258 180 275 L197 310 L135 313 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M159 315 Q260 305 422 296 L441 317 Z" fill="#dcefeb" stroke="#16838a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M159 315 L422 304 M159 315 L433 311" fill="none" stroke="#16838a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="312" r="11" fill="#c86c2e"/><path d="M153 287 L32 240" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="153" cy="287" r="4" fill="#16838a"/><text x="32" y="230" font-size="24" fill="#213b45" text-anchor="start">跟骨</text><path d="M292 310 L275 407" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="292" cy="310" r="4" fill="#16838a"/><text x="275" y="397" font-size="24" fill="#213b45" text-anchor="middle">足底筋膜</text><path d="M430 303 L467 248" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="303" r="4" fill="#16838a"/><text x="467" y="238" font-size="24" fill="#213b45" text-anchor="start">前足</text><text x="300" y="50" font-size="20" fill="#769b9f" text-anchor="middle">足部內側示意</text><path d="M32 455 L568 455" fill="none" stroke="#d0dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="493" font-size="24" fill="#213b45" text-anchor="start">足底筋膜：腳跟到前足</text><text x="32" y="533" font-size="22" fill="#16838a" text-anchor="start">1. 跟骨</text><text x="32" y="563" font-size="20" fill="#213b45" text-anchor="start">足底筋膜由腳跟附近向前延伸。</text><text x="32" y="608" font-size="22" fill="#16838a" text-anchor="start">2. 筋膜扇形束</text><text x="32" y="638" font-size="20" fill="#213b45" text-anchor="start">沿足底延展，參與支撐足弓。</text><text x="32" y="683" font-size="22" fill="#16838a" text-anchor="start">3. 疼痛線索</text><text x="32" y="713" font-size="20" fill="#213b45" text-anchor="start">晨起第一步痛是常見表現，但仍需排除其他原因。</text><text x="32" y="781" font-size="17" fill="#769b9f" text-anchor="start">2D 簡化示意・尚待醫師審閱・比例不供量測</text></g></svg>
