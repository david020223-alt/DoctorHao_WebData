<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">網球腿：不只是小腿痠・2D 示意圖</title><desc id="desc">腓腸肌：位於小腿後側表層，跨過膝關節與踝關節。 肌腱交界：肌肉與肌腱交接處，是需要評估的區域之一。 鑑別診斷：小腿痛可能來自多種問題，不能只依疼痛位置定論。</desc><rect width="600" height="440" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><path d="M270 70 L345 70 Q365 125 339 196 L316 266 L324 325 L431 342 Q450 360 422 369 L262 369 Q242 353 252 319 L262 249 Q228 169 270 70 Z" fill="#f6f4eb" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M278 85 Q241 165 281 237 Q302 254 324 207 Q346 138 328 85 Z" fill="#dcefeb" stroke="#16838a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M292 238 Q285 280 278 338" fill="none" stroke="#16838a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M266 337 L309 337 L320 357 L264 357 Z" fill="#f2e9d5" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="293" cy="237" r="12" fill="#c86c2e"/><path d="M271 154 L40 155" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="271" cy="154" r="4" fill="#16838a"/><text x="40" y="145" font-size="24" fill="#213b45" text-anchor="start">小腿肌群</text><path d="M288 264 L382 264" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="288" cy="264" r="4" fill="#16838a"/><text x="382" y="254" font-size="24" fill="#213b45" text-anchor="start">肌腱交界</text><path d="M282 349 L113 385" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="282" cy="349" r="4" fill="#16838a"/><text x="113" y="375" font-size="24" fill="#213b45" text-anchor="start">跟骨</text></g></svg>
