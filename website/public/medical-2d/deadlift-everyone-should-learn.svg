<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">硬舉：先認識髖折疊・2D 示意圖</title><desc id="desc">髖部後移：軀幹與髖部協調，練習可控制的活動範圍。 軀幹穩定：呼吸、軀幹控制與負荷需配合個人能力。 循序增加：先學動作，再調整重量；不是所有人都需相同姿勢或重量。</desc><rect width="600" height="440" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><circle cx="359" cy="117" r="25" fill="#16838a"/><path d="M337 155 L259 226 L311 298 L276 368 M259 226 L222 302 L196 369 M337 168 L400 221 L410 256" fill="none" stroke="#16838a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><circle cx="259" cy="226" r="9" fill="#c86c2e"/><circle cx="311" cy="298" r="9" fill="#c86c2e"/><path d="M145 391 L462 391" fill="none" stroke="#769b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="30" font-size="20" fill="#769b9f" text-anchor="middle">動作概念示意</text><path d="M259 226 L40 231" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="259" cy="226" r="4" fill="#16838a"/><text x="40" y="221" font-size="24" fill="#213b45" text-anchor="start">髖部</text><path d="M311 298 L461 294" fill="none" stroke="#769b9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="311" cy="298" r="4" fill="#16838a"/><text x="461" y="284" font-size="24" fill="#213b45" text-anchor="start">膝部</text></g></svg>
